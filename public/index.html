<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospecta IA</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76; --border: #d8dee4;
    --accent: #0b6bcb; --ok: #1a7f37; --danger: #cf222e; --chip: #eef3f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --border: #30363d;
            --accent: #4493f8; --ok: #3fb950; --danger: #f85149; --chip: #1f2a37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 16px 8px; max-width: 980px; margin: auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  main { max-width: 980px; margin: auto; padding: 0 16px 48px; }
  .muted { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 16px 0; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .acoes, .abas { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { color: var(--ok); } button.perigo { color: var(--danger); }
  .abas button[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .card h3 { margin: 0; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg);
                    border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  textarea { min-height: 200px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .linha { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .erro { color: var(--danger); font-size: 14px; }
  .aviso { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; display: none; max-width: calc(100% - 32px); }
  a { color: var(--accent); word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>Prospecta IA</h1>
  <div class="muted">Empresas encontradas, propostas geradas pela IA e envios.</div>
</header>
<main>
  <section class="stats" id="stats"></section>

  <div class="acoes">
    <button data-etapa="descobrir">1. Buscar empresas</button>
    <button data-etapa="analisar">2. Analisar sites</button>
    <button data-etapa="propor">3. Gerar propostas</button>
    <button data-etapa="enviar">4. Enviar aprovadas</button>
    <button data-etapa="ciclo" class="primario">Rodar ciclo completo</button>
  </div>

  <nav class="abas" role="tablist">
    <button role="tab" data-aba="rascunho" aria-selected="true">Para aprovar</button>
    <button role="tab" data-aba="aprovada">Na fila de envio</button>
    <button role="tab" data-aba="enviada">Enviadas</button>
    <button role="tab" data-aba="erro">Com erro</button>
    <button role="tab" data-aba="leads:contatado">Empresas contatadas</button>
    <button role="tab" data-aba="leads:respondeu">Responderam</button>
  </nav>

  <section id="lista"></section>
</main>
<div class="aviso" id="aviso"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let abaAtual = "rascunho";

async function api(caminho, opcoes = {}) {
  const resp = await fetch(caminho, { headers: { "Content-Type": "application/json" }, ...opcoes });
  const dados = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(dados.erro || resp.statusText);
  return dados;
}

function avisar(texto) {
  const el = $("#aviso");
  el.textContent = texto;
  el.style.display = "block";
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => (el.style.display = "none"), 3500);
}

async function carregarStats() {
  const s = await api("/api/stats");
  const itens = [
    ["Empresas analisadas", (s.leads.analisado ?? 0) + (s.leads.proposta_gerada ?? 0) + (s.leads.contatado ?? 0) + (s.leads.respondeu ?? 0)],
    ["Para aprovar", s.mensagens.rascunho ?? 0],
    ["Na fila", s.mensagens.aprovada ?? 0],
    ["Enviadas hoje", s.enviadasHoje],
    ["Total enviadas", s.mensagens.enviada ?? 0],
    ["Responderam", s.leads.respondeu ?? 0],
    ["Descadastros", s.descadastros],
  ];
  $("#stats").innerHTML = itens.map(([t, n]) => `<div class="stat"><b>${n}</b><span class="muted">${t}</span></div>`).join("");
}

function cardMensagem(m) {
  const editavel = m.status === "rascunho" || m.status === "aprovada" || m.status === "erro";
  return `<article class="card" data-id="${m.id}">
    <h3>${esc(m.empresa)}</h3>
    <div class="muted">${esc(m.nicho)} · ${esc(m.cidade)} · ${m.canal === "email" ? "E-mail" : "WhatsApp"}: ${esc(m.destino)}</div>
    ${m.site ? `<div><a href="${esc(m.site)}" target="_blank" rel="noopener">${esc(m.site)}</a></div>` : `<div class="muted">Sem site</div>`}
    <div class="chips">${m.oportunidades.map((o) => `<span class="chip" title="${esc(o.motivo)}">${esc(o.servico)}: ${esc(o.motivo)}</span>`).join("")}</div>
    ${m.erro ? `<div class="erro">${esc(m.erro)}</div>` : ""}
    ${m.canal === "email" ? `<label>Assunto</label><input name="assunto" value="${esc(m.assunto)}" ${editavel ? "" : "disabled"}>` : ""}
    <label>Mensagem</label><textarea name="corpo" ${editavel ? "" : "disabled"}>${esc(m.corpo)}</textarea>
    ${editavel ? `<div class="linha">
      ${m.status !== "aprovada" ? `<button class="ok" data-acao="aprovar">Aprovar e pôr na fila</button>` : ""}
      <button data-acao="salvar">Salvar edição</button>
      <button class="perigo" data-acao="rejeitar">Rejeitar</button>
    </div>` : `<div class="muted" style="margin-top:8px">Enviada em ${new Date(m.enviada_em).toLocaleString("pt-BR")}</div>`}
  </article>`;
}

function cardLead(l) {
  return `<article class="card" data-lead="${l.id}">
    <h3>${esc(l.nome)}</h3>
    <div class="muted">${esc(l.nicho)} · ${esc(l.cidade)} · ${esc(l.email || "")} ${esc(l.whatsapp || "")}</div>
    ${l.observacao ? `<div>${esc(l.observacao)}</div>` : ""}
    <div class="linha">
      ${l.status !== "respondeu" ? `<button class="ok" data-status="respondeu">Marcar que respondeu</button>` : ""}
      <button data-status="descartado">Descartar</button>
      <button class="perigo" data-status="descadastrado">Pediu para não receber</button>
    </div>
  </article>`;
}

async function carregarLista() {
  const lista = $("#lista");
  try {
    if (abaAtual.startsWith("leads:")) {
      const leads = await api(`/api/leads?status=${abaAtual.split(":")[1]}`);
      lista.innerHTML = leads.length ? leads.map(cardLead).join("") : `<p class="muted">Nada por aqui ainda.</p>`;
    } else {
      const msgs = await api(`/api/mensagens?status=${abaAtual}`);
      lista.innerHTML = msgs.length ? msgs.map(cardMensagem).join("") : `<p class="muted">Nada por aqui ainda.</p>`;
    }
  } catch (e) {
    lista.innerHTML = `<p class="erro">${esc(e.message)}</p>`;
  }
}

async function atualizar() {
  await Promise.all([carregarStats(), carregarLista()]);
}

document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  try {
    if (btn.dataset.etapa) {
      const r = await api(`/api/etapas/${btn.dataset.etapa}`, { method: "POST" });
      avisar(r.mensagem);
    } else if (btn.dataset.aba) {
      abaAtual = btn.dataset.aba;
      document.querySelectorAll("[data-aba]").forEach((b) => b.setAttribute("aria-selected", b === btn));
      await carregarLista();
    } else if (btn.dataset.acao) {
      const card = btn.closest("[data-id]");
      const id = card.dataset.id;
      const corpo = $("textarea", card).value;
      const assunto = $("input[name=assunto]", card)?.value;
      await api(`/api/mensagens/${id}`, { method: "PUT", body: JSON.stringify({ assunto, corpo }) });
      if (btn.dataset.acao !== "salvar") await api(`/api/mensagens/${id}/${btn.dataset.acao}`, { method: "POST" });
      avisar({ aprovar: "Aprovada e na fila de envio", rejeitar: "Rejeitada", salvar: "Edição salva" }[btn.dataset.acao]);
      await atualizar();
    } else if (btn.dataset.status) {
      const id = btn.closest("[data-lead]").dataset.lead;
      await api(`/api/leads/${id}/status`, { method: "POST", body: JSON.stringify({ status: btn.dataset.status }) });
      avisar("Atualizado");
      await atualizar();
    }
  } catch (e) {
    avisar(`Erro: ${e.message}`);
  }
});

atualizar();
setInterval(carregarStats, 15000);
</script>
</body>
</html>
