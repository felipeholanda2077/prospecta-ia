# Rodada do funil automático.
# O plano gratuito da Vercel só permite agendar uma execução por dia, então este
# agendamento chama o sistema a cada 10 minutos. Antes das 9h ele só prepara as
# mensagens do dia; o envio confere o horário (9h às 18h de Brasília, segunda a
# sexta) e não envia nada fora dele.
#
# Autenticação: o GitHub emite um token OIDC assinado para esta execução e o
# sistema confere a assinatura e de qual repositório/workflow ele veio. Não há
# segredo para copiar.
name: Envios em horário comercial

on:
  schedule:
    # Minuto 3, 13, 23...: o GitHub atrasa ou pula agendamentos no minuto cheio (:00), quando todo mundo roda.
    - cron: "3-59/10 9-20 * * 1-5" # 6h03 às 17h53 em Brasília (UTC-3), segunda a sexta
  workflow_dispatch:

permissions:
  id-token: write # permite pedir o token OIDC
  contents: read

jobs:
  envios:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Rodada de envios
        env:
          URL: ${{ vars.PROSPECTA_URL || 'https://prospecta-ia-three.vercel.app' }}
        run: |
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=prospecta-ia" | jq -r .value)"
          curl -fsS --max-time 300 -H "Authorization: Bearer $TOKEN" "$URL/api/cron/envios"
